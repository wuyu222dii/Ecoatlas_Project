# Render / cloud hosts inject PORT; default 8080 for local.
server:
  port: ${PORT:8080}

spring:
  application:
    name: demo
  datasource:
    url: ${SPRING_DATASOURCE_URL:}
    username: ${SPRING_DATASOURCE_USERNAME:}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    hikari:
      # Neon / pooler has a low connection cap; keep pool small.
      maximum-pool-size: 3
      minimum-idle: 1
      max-lifetime: 540000
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false
  flyway:
    baseline-on-migrate: true
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=2000,expireAfterAccess=120s
  mail:
    host: smtp.gmail.com
    port: 587
    username: txin987@gmail.com
    password: "fdhm svtk wruq yfwh"
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  data:
    redis:
      repositories:
        enabled: false

# JWT
jwt:
  secret: ${JWT_SECRET:SixCookiesJwtSecretKeyForAuthPleaseChangeInProduction}
  expiration-ms: 315360000000

# Logging (reduce Netty DNS noise, etc.)
logging:
  level:
    io.netty: WARN
    org.springframework.boot.autoconfigure.security: WARN

# Google OAuth2 (id_token verified by GoogleIdTokenVerifier; no client-secret needed)
# Must match front-end VITE_GOOGLE_CLIENT_ID (same OAuth Web client).
google:
  client-id: ${GOOGLE_CLIENT_ID:}
  # Places API (New). Create an API key in Google Cloud; enable Places API (New).
  maps:
    api-key: ${GOOGLE_MAPS_API_KEY:}
    base-url: https://places.googleapis.com/v1
    request-timeout-seconds: 15

# Gemini (EchoAtlas AI). Prefer env in production.
ai:
  gemini:
    api-key: ${AI_GEMINI_API_KEY:}
    model: gemini-2.0-flash
    base-url: https://generativelanguage.googleapis.com/v1beta
    temperature: 0.45
    max-output-tokens: 8192
    request-timeout-seconds: 90

# Spotify Web API (user OAuth, search, tracks).
spotify:
  client-id: ${SPOTIFY_CLIENT_ID:}
  client-secret: ${SPOTIFY_CLIENT_SECRET:}
  # Must match a Redirect URI in the Dashboard (page that receives ?code=)
  default-redirect-uri: ${SPOTIFY_DEFAULT_REDIRECT_URI:http://127.0.0.1:5173/spotify-callback}
  scopes: user-read-email user-read-private user-library-read user-library-modify
  state-ttl-minutes: 10
  http-timeout-seconds: 30